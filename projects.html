<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects & Regional Footprint | Adde Design Studio</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    .filter-bar { display:flex; flex-wrap:wrap; gap:0.75rem; align-items:center; margin-bottom:2rem; padding:1.25rem; background:#fff; border:1px solid var(--line); }
    .filter-btn { padding:0.5rem 1rem; border:1px solid var(--line); background:transparent; font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; cursor:pointer; }
    .filter-btn.active { background:var(--charcoal); color:var(--stone); border-color:var(--charcoal); }
    #projectsMap { height:540px; width:100%; border:1px solid var(--line); display:none; z-index:1; }
    .adde-pin { width:18px; height:18px; background:var(--bronze); border:3px solid var(--charcoal); border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,0.4); }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main style="padding-top:110px;padding-bottom:5rem;">
    <div class="container">
      <div style="max-width:740px;margin-bottom:2.25rem;">
        <div class="eyebrow" id="pEyebrow">PORTFOLIO & EAST AFRICA MAP</div>
        <h1 class="h2-section" id="pTitle">Architectural Portfolio & Regional Footprint</h1>
        <p class="text-muted" id="pSub" style="margin-top:0.65rem;">Filter commissions by category, status, or city—or inspect our footprint across Somalia, Kenya, Djibouti & Ethiopia.</p>
      </div>

      <div class="filter-bar">
        <div style="display:flex;flex-wrap:wrap;gap:0.45rem;" id="catFilters">
          <button class="filter-btn active" data-cat="All">All</button>
          <button class="filter-btn" data-cat="Residential">Residential</button>
          <button class="filter-btn" data-cat="Commercial">Commercial</button>
          <button class="filter-btn" data-cat="Interior">Interior</button>
          <button class="filter-btn" data-cat="Masterplan">Masterplan</button>
        </div>
        <select id="statusFilter" class="input-field" style="width:auto;min-width:165px;padding:0.5rem 0.75rem;">
          <option value="All">Status: All</option>
          <option value="3D Concept">3D Concept</option>
          <option value="Under Construction">Under Construction</option>
          <option value="Completed">Completed</option>
        </select>
        <select id="cityFilter" class="input-field" style="width:auto;min-width:155px;padding:0.5rem 0.75rem;">
          <option value="All">City: All</option>
        </select>
        <input id="searchBox" type="search" placeholder="Search..." class="input-field" style="flex:1;min-width:180px;padding:0.5rem 0.85rem;">
        <div style="display:flex;border:1px solid var(--charcoal);">
          <button id="btnGrid" class="filter-btn active" style="border:none;">Grid</button>
          <button id="btnMap" class="filter-btn" style="border:none;">Map</button>
        </div>
      </div>

      <div id="projectsGrid" class="standard-grid"></div>
      <div id="projectsMap"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initShell } from '/assets/js/components.js';
    import { fetchStaticJson, escHtml } from '/assets/js/api.js';
    import { getLang } from '/assets/js/i18n.js';

    initShell({ transparentHero: false, activePath: 'projects' });

    let allProjects = [], activeCat = 'All', viewMode = 'grid', mapInstance = null, markersLayer = null;

    const COPY = {
      en: { eb: 'PORTFOLIO & EAST AFRICA MAP', t: 'Architectural Portfolio & Regional Footprint', s: 'Filter commissions by category, status, or city—or inspect our footprint across Somalia, Kenya, Djibouti & Ethiopia.', none: 'No matching projects found.' },
      so: { eb: 'MASHAARIICDA & MAABKA GOBOLKA', t: 'Mashaariicda & Goobaha Bariga Afrika', s: 'Ku shaandhee nooca, xaaladda, ama magaalada—ama ka daawo maabka Soomaaliya, Kenya, Jabuuti & Itoobiya.', none: 'Mashruuc ku habboon lama helin.' }
    };

    function getFiltered() {
      const st = document.getElementById('statusFilter').value;
      const ct = document.getElementById('cityFilter').value;
      const q = document.getElementById('searchBox').value.trim().toLowerCase();
      return allProjects.filter((p) => {
        if (activeCat !== 'All' && p.category !== activeCat) return false;
        if (st !== 'All' && p.status !== st) return false;
        if (ct !== 'All' && p.city !== ct) return false;
        if (q && !(p.title_en + ' ' + p.title_so + ' ' + p.city + ' ' + p.category).toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function render() {
      const lang = getLang();
      const c = COPY[lang] || COPY.en;
      document.getElementById('pEyebrow').textContent = c.eb;
      document.getElementById('pTitle').textContent = c.t;
      document.getElementById('pSub').textContent = c.s;

      const list = getFiltered();
      const grid = document.getElementById('projectsGrid');
      const mapEl = document.getElementById('projectsMap');

      if (viewMode === 'grid') {
        grid.style.display = 'grid';
        mapEl.style.display = 'none';
        grid.innerHTML = list.length ? list.map((p) => {
          const title = lang === 'so' ? (p.title_so || p.title_en) : p.title_en;
          const badgeCls = p.status === 'Completed' ? 'completed' : (p.status === 'Under Construction' ? 'progress' : 'concept');
          return `<a href="/project-detail.html?slug=${encodeURIComponent(p.slug)}" class="project-card">
            <div class="project-thumb">
              <img src="${escHtml(p.render_url)}" alt="${escHtml(title)}" loading="lazy">
              <span class="status-badge ${badgeCls}">${escHtml(p.status)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;gap:0.75rem;">
              <h3 class="font-serif" style="font-size:1.25rem;">${escHtml(title)}</h3>
              <span style="font-size:0.78rem;color:var(--concrete);">${escHtml(p.area_sqm)} m²</span>
            </div>
            <div style="font-size:0.82rem;color:var(--concrete);margin-top:0.2rem;">${escHtml(p.city)} • ${escHtml(p.category)} • ${escHtml(p.year)}</div>
          </a>`;
        }).join('') : `<p class="text-muted">${c.none}</p>`;
      } else {
        grid.style.display = 'none';
        mapEl.style.display = 'block';
        if (!mapInstance) {
          mapInstance = L.map('projectsMap').setView([4.5, 42.5], 5);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(mapInstance);
          markersLayer = L.layerGroup().addTo(mapInstance);
        }
        setTimeout(() => mapInstance.invalidateSize(), 120);
        markersLayer.clearLayers();
        const pinIcon = L.divIcon({ className: 'adde-pin', iconSize: [18, 18], iconAnchor: [9, 9] });
        list.forEach((p) => {
          if (p.lat && p.lng) {
            const title = lang === 'so' ? (p.title_so || p.title_en) : p.title_en;
            const m = L.marker([p.lat, p.lng], { icon: pinIcon }).addTo(markersLayer);
            m.bindPopup(`<div style="min-width:190px;font-family:sans-serif;">
              <img src="${escHtml(p.render_url)}" style="width:100%;height:95px;object-fit:cover;margin-bottom:6px;">
              <b>${escHtml(title)}</b><br><small>${escHtml(p.city)} • ${escHtml(p.area_sqm)} m²</small><br>
              <a href="/project-detail.html?slug=${encodeURIComponent(p.slug)}" style="color:#B86B35;font-weight:700;display:inline-block;margin-top:4px;">View Case Study →</a>
            </div>`);
          }
        });
      }
    }

    document.querySelectorAll('#catFilters button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#catFilters button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        activeCat = btn.dataset.cat;
        render();
      });
    });
    document.getElementById('statusFilter').addEventListener('change', render);
    document.getElementById('cityFilter').addEventListener('change', render);
    document.getElementById('searchBox').addEventListener('input', render);
    document.getElementById('btnGrid').addEventListener('click', () => { viewMode = 'grid'; btnGrid.classList.add('active'); btnMap.classList.remove('active'); render(); });
    document.getElementById('btnMap').addEventListener('click', () => { viewMode = 'map'; btnMap.classList.add('active'); btnGrid.classList.remove('active'); render(); });
    window.addEventListener('adde:langchange', render);

    (async () => {
      allProjects = await fetchStaticJson('/data/projects.json').catch(() => []);
      const cities = [...new Set(allProjects.map((p) => p.city).filter(Boolean))];
      const sel = document.getElementById('cityFilter');
      cities.forEach((c) => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
      render();
    })();
  </script>
</body>
</html>
